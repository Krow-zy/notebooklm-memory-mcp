name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v0.1.0"
        required: false
        default: ""
        type: string
      publish:
        description: "Publish the verified tag as a GitHub release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.13"
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run guard tests
        run: uv run pytest -q
      - name: Check Python syntax
        run: uv run python -m compileall -q src tests tools
      - name: Check tag matches package version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(uv run python -c 'import notebooklm_memory_mcp as m; print(m.__version__)')
          if [ "$TAG" != "v$version" ]; then
            echo "tag '$TAG' does not match package version '$version'"
            exit 1
          fi
      - name: Build wheel and sdist
        run: uv build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    if: ${{ inputs.publish == true }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --generate-notes
