[project]
name = "notebooklm-memory-mcp"
version = "0.1.0"
description = "Local NotebookLM MCP server with pinned dependencies, corpus-only paths, and no cookie or token forwarding."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Krow-zy" }]
dependencies = [
    "notebooklm-py[browser,cookies,mcp,headless]==0.8.6",
]

[project.scripts]
notebooklm-memory-mcp = "notebooklm_memory_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Krow-zy/notebooklm-memory-mcp"
Repository = "https://github.com/Krow-zy/notebooklm-memory-mcp"
Issues = "https://github.com/Krow-zy/notebooklm-memory-mcp/issues"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notebooklm_memory_mcp"]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
